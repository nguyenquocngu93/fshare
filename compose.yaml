services:
  torr-shelf:
    build: .
    container_name: torr-shelf
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      TMDB_API_TOKEN: "${TMDB_API_TOKEN:-}"
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      TMDB_LANGUAGE: "${TMDB_LANGUAGE:-vi-VN}"
      TMDB_REGION: "${TMDB_REGION:-VN}"
      DNS_RESULT_ORDER: "${DNS_RESULT_ORDER:-ipv4first}"
      TORRSERVER_URL: "${TORRSERVER_URL:-http://host.docker.internal:8090}"
      TORRSERVER_PUBLIC_URL: "${TORRSERVER_PUBLIC_URL:-http://127.0.0.1:8090}"
      TORRSERVER_USERNAME: "${TORRSERVER_USERNAME:-}"
      TORRSERVER_PASSWORD: "${TORRSERVER_PASSWORD:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
